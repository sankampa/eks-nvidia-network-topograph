# Smoke Test — Proves basic Kueue admission works (single-cluster, no TAS, no MultiKueue)
#
# Apply this AFTER setting up the base queue objects (topology-tas-flavor.yaml).
# If the job gets Admitted and Completes, Kueue is working.
#
# Customize:
#   - Replace <YOUR_NAMESPACE> with your job namespace
#   - Replace <YOUR_LOCAL_QUEUE> with your LocalQueue name
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kueue-smoke
  namespace: <YOUR_NAMESPACE>
  labels:
    kueue.x-k8s.io/queue-name: <YOUR_LOCAL_QUEUE>   # e.g. tas-local-queue
spec:
  parallelism: 1
  completions: 1
  suspend: true                                      # REQUIRED: Kueue admits by un-suspending
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sh", "-c", "echo kueue-admitted on $(hostname); sleep 5; echo done"]
          resources:
            requests:
              cpu: "1"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
