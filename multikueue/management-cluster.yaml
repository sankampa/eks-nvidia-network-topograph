# MultiKueue — MANAGEMENT (control-plane) cluster
#
# Apply on the ONE cluster you submit all jobs to. It does not need GPU nodes;
# it dispatches whole jobs to a worker cluster that can admit them.
# MultiKueue never splits a single job across clusters.
#
# Customize:
#   - Replace <YOUR_NAMESPACE> with your job namespace (must match workers)
#   - Adjust nominalQuota (logical fleet totals >= sum of workers)
#   - Worker kubeconfig Secrets must exist in kueue-system (see scripts/)
#
# Naming contract: the job NAMESPACE and LOCALQUEUE NAME below MUST also exist
# on every worker (see worker-cluster.yaml).
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: MultiKueueCluster
metadata:
  name: worker-a
spec:
  kubeConfig:
    locationType: Secret
    location: worker-a-kubeconfig
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: MultiKueueCluster
metadata:
  name: worker-b
spec:
  kubeConfig:
    locationType: Secret
    location: worker-b-kubeconfig
---
# Ordered preference: worker-a fills first; worker-b on failover.
apiVersion: kueue.x-k8s.io/v1beta1
kind: MultiKueueConfig
metadata:
  name: fleet-config
spec:
  clusters:
    - worker-a
    - worker-b
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: AdmissionCheck
metadata:
  name: fleet-multikueue
spec:
  controllerName: kueue.x-k8s.io/multikueue
  parameters:
    apiGroup: kueue.x-k8s.io
    kind: MultiKueueConfig
    name: fleet-config
---
# Logical flavor — no nodeLabels. Placement happens on the worker.
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: fleet-logical
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: fleet-cq
spec:
  namespaceSelector: {}
  admissionChecks:
    - fleet-multikueue
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu", "vpc.amazonaws.com/efa"]
      flavors:
        - name: fleet-logical
          resources:
            - name: "cpu"
              nominalQuota: "100000"
            - name: "memory"
              nominalQuota: "1000000Gi"
            - name: "nvidia.com/gpu"
              nominalQuota: "10000"
            - name: "vpc.amazonaws.com/efa"
              nominalQuota: "10000"
---
# Submit ALL multi-cluster jobs to this LocalQueue.
# Name (fleet-lq) and namespace MUST match on every worker.
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: fleet-lq
  namespace: <YOUR_NAMESPACE>                  # e.g. training
spec:
  clusterQueue: fleet-cq
